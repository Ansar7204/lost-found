name: backend-image

on:
  push:
    branches: [main]
    paths-ignore: ['lost-found-frontend/**']   # front-end-only changes don't rebuild the API
  workflow_dispatch:

permissions:
  contents: read
  packages: write            # lets the workflow push to GHCR

concurrency:
  group: backend-deploy      # never run two deploys at the same time
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native arm64 runner (free for public repos), matches your VM
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tamirlanm/lost-found-api:${{ github.sha }}
            ghcr.io/tamirlanm/lost-found-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build                       # runs only after the image was built and pushed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$HOST" "backend $GITHUB_SHA"
