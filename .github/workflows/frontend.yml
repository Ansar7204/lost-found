name: frontend
on:
  push:
    branches: [main]
    paths: ['lost-found-frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['lost-found-frontend/**']
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: lost-found-frontend
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: lost-found-frontend/.nvmrc
          cache: npm
          cache-dependency-path: lost-found-frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check      # delete this line if it blocks deploys over formatting
      - run: npm run test:ci
      - run: npm run build
      - name: Deploy over SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf "$RUNNER_TEMP/site.tar.gz" -C dist/lost-found/browser .
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$HOST" frontend < "$RUNNER_TEMP/site.tar.gz"
